---
# Continuous deployment to Amazon EKS on every push to main.
#   0. checks:     the full CI security suite (ci.yaml): secrets, lint, tests, npm audit, hadolint,
#                  Trivy image + IaC scans, kubeconform, pipeline security. Any failure stops the release.
#   1. build-scan: builds the image and blocks on vulnerabilities. No cloud credentials at all.
#   2. deploy:     only if 1 passed. Short-lived AWS credentials through GitHub OIDC (no stored keys),
#                  push to ECR by digest, sign with cosign, deploy the exact digest, wait, smoke test.
name: deploy

on:
  push:
    branches: [main]
    paths:
      - app/**
      - k8s/**
      - .github/workflows/deploy.yaml
      - .github/workflows/ci.yaml
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  CLUSTER: eks-devsecops
  REPOSITORY: eks-devsecops/profile-card
  NAMESPACE: profile-card

jobs:
  checks:
    name: Security checks
    permissions:
      contents: read
    # The self-repository form ($/...) is safer, but actionlint 1.7.12 does not parse it yet. This job has no
    # earlier steps that could plant files, so ./ is equivalent here.
    uses: ./.github/workflows/ci.yaml # zizmor: ignore[self-repository]

  build-scan:
    name: Build and scan
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/ci/install-tools.sh trivy syft
      - name: Build
        run: |
          docker build --build-arg VERSION="1.0.${GITHUB_RUN_NUMBER}" --build-arg COMMIT="${GITHUB_SHA}" \
            --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            -t profile-card:build app
      - name: Vulnerability gate (no fixable CRITICAL or HIGH)
        run: |
          trivy image --quiet --severity CRITICAL,HIGH --ignore-unfixed --format table profile-card:build | tee trivy.txt
          trivy image --quiet --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed profile-card:build
      - name: SBOM (CycloneDX)
        run: syft scan --quiet docker:profile-card:build -o cyclonedx-json=sbom.cdx.json
      - name: Hand the scanned image to the deploy job
        run: docker save profile-card:build | gzip > image.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image
          path: |
            image.tar.gz
            sbom.cdx.json
            trivy.txt
          retention-days: 7

  deploy:
    name: Deploy to EKS
    needs: build-scan
    # Switched on only while the lab cluster exists (repository variable).
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: ${{ steps.smoke.outputs.url }}
    permissions:
      contents: read
      id-token: write   # GitHub OIDC token -> AWS role (and keyless cosign signature)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - run: scripts/ci/install-tools.sh cosign
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-deploy-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Push to ECR by digest
        id: push
        run: |
          account="$(aws sts get-caller-identity --query Account --output text)"
          echo "::add-mask::${account}"
          registry="${account}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "${registry}"
          gunzip -c image.tar.gz | docker load --quiet
          tag="1.0.${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          docker tag profile-card:build "${registry}/${REPOSITORY}:${tag}"
          docker push --quiet "${registry}/${REPOSITORY}:${tag}"
          ref="$(docker inspect --format '{{index .RepoDigests 0}}' "${registry}/${REPOSITORY}:${tag}")"
          {
            echo "repository=${registry}/${REPOSITORY}"
            echo "digest=${ref##*@}"
            echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"
      - name: ECR scan on push (second opinion, fails on CRITICAL)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # The scan is registered a few seconds after the push (the CLI waiter gives up on ScanNotFoundException).
          status=""
          for _ in $(seq 1 60); do
            status="$(aws ecr describe-image-scan-findings --repository-name "${REPOSITORY}" --image-id imageDigest="${DIGEST}" \
              --query 'imageScanStatus.status' --output text 2>/dev/null || true)"
            [[ "${status}" == "COMPLETE" || "${status}" == "FAILED" || "${status}" == "UNSUPPORTED_IMAGE" ]] && break
            sleep 5
          done
          echo "ECR scan status: ${status}"
          [[ "${status}" == "COMPLETE" ]]
          # With zero findings ECR returns no counts at all, so an empty answer means 0.
          counts="$(aws ecr describe-image-scan-findings --repository-name "${REPOSITORY}" --image-id imageDigest="${DIGEST}" \
            --query 'imageScanFindings.findingSeverityCounts' --output json)"
          counts="${counts:-null}"
          echo "ECR findings by severity: $(jq -c '. // {}' <<<"${counts}")"
          [[ "$(jq -r '(. // {}).CRITICAL // 0' <<<"${counts}")" == 0 ]]
      - name: Sign the image (keyless, recorded in the public Rekor log)
        env:
          IMAGE: ${{ steps.push.outputs.repository }}@${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}"
          cosign verify "${IMAGE}" \
            --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/deploy.yaml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "signed and verified"
      - name: Deploy the exact digest
        env:
          REPO: ${{ steps.push.outputs.repository }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          aws eks update-kubeconfig --name "${CLUSTER}" --region "${AWS_REGION}" > /dev/null
          sed -i -e "s|IMAGE_REPOSITORY|${REPO}|" -e "s|IMAGE_DIGEST|${DIGEST}|" k8s/kustomization.yaml
          kubectl apply -k k8s
          kubectl -n "${NAMESPACE}" rollout status deployment/profile-card --timeout=300s
      - name: Least privilege check (this pipeline must not be able to touch anything else)
        run: |
          ok=1
          expect() {  # expected answer, then the kubectl auth can-i arguments
            local want="$1" got; shift
            got="$(kubectl auth can-i "$@" 2>/dev/null || true)"
            echo "can-i $* -> ${got} (expected ${want})"
            [[ "${got}" == "${want}" ]] || ok=0
          }
          expect yes create deployments -n "${NAMESPACE}"
          expect no create deployments -n kube-system
          expect no get secrets -n kube-system
          expect no create clusterrolebindings
          expect no delete namespaces
          (( ok ))
      - name: Smoke test through the load balancer
        id: smoke
        run: |
          for _ in $(seq 1 60); do
            host="$(kubectl -n "${NAMESPACE}" get ingress profile-card -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')"
            if [[ -n "${host}" ]] && curl -fsS -m 5 "http://${host}/healthz" > /dev/null 2>&1 \
               && curl -fsS -m 5 "http://${host}/" | grep -q "Profile"; then
              echo "url=http://${host}" >> "$GITHUB_OUTPUT"
              echo "Live: http://${host} (commit ${GITHUB_SHA::7})" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "the load balancer did not answer in 10 minutes" >&2
          exit 1
