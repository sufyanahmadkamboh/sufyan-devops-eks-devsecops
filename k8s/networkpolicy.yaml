# Default deny for the namespace, then one exception: HTTP on 8080 from the load balancer's subnets only.
# (On EKS, pod IPs come from the VPC range, so "allow the VPC" would also allow every other pod in the cluster.
#  Kubelet health probes keep working: the VPC CNI network policy agent allows traffic from the node itself.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-http-from-load-balancer
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: {cidr: 10.42.48.0/23}   # public subnets, where the ALB's network interfaces live
      ports:
        - {protocol: TCP, port: 8080}
