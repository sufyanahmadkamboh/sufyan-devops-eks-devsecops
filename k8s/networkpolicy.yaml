# Default deny for the namespace, then one exception: HTTP on 8080 from inside the VPC
# (the load balancer's network interfaces and the kubelet health probes).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-http-from-vpc
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: {cidr: 10.42.0.0/16}
      ports:
        - {protocol: TCP, port: 8080}
